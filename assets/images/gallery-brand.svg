<svg width="600" height="480" viewBox="0 0 600 480" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Deep Navy minimal background -->
  <rect width="600" height="480" fill="#0f172a"/>

  <!-- Isometric Device / Card Mockup -->
  <g transform="translate(180, 100)">
    <!-- Shadow -->
    <path d="M120 40 L280 120 L160 220 L0 140 Z" fill="#000000" fill-opacity="0.4"/>
    
    <!-- Base Card -->
    <path d="M120 20 L280 100 L160 180 L0 100 Z" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <path d="M0 100 L160 180 L160 196 L0 116 Z" fill="#0f172a"/>
    <path d="M160 180 L280 100 L280 116 L160 196 Z" fill="#1e293b"/>

    <!-- Glowing interface layer on card -->
    <path d="M120 -20 L280 60 L160 140 L0 60 Z" fill="#8400f0" fill-opacity="0.85" stroke="#a855f7" stroke-width="1.5"/>
    <circle cx="140" cy="50" r="18" fill="#ffffff" fill-opacity="0.9"/>
  </g>

  <!-- Typography -->
  <text x="50" y="380" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="30" font-weight="800">INTERFACE MOTION</text>
  <text x="50" y="408" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="14">Spatial Design System &amp; Isometric UI</text>

  <!-- Pill -->
  <rect x="50" y="428" width="90" height="26" rx="13" fill="#8400f0"/>
  <text x="95" y="445" fill="#ffffff" font-family="'Inter', sans-serif" font-size="11" font-weight="700" text-anchor="middle">UI / UX</text>
</svg>
