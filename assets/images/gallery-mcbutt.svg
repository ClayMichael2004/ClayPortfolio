<svg width="600" height="480" viewBox="0 0 600 480" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Minimal clean light gray background -->
  <rect width="600" height="480" fill="#e8e8ec"/>

  <!-- Top Title: McButt in bold red -->
  <text x="300" y="80" fill="#e11d48" font-family="'Plus Jakarta Sans', sans-serif" font-size="36" font-weight="900" text-anchor="middle" letter-spacing="-0.5">McButt</text>

  <!-- Illustration Group -->
  <g transform="translate(300, 260)">
    
    <!-- Underwear Waistband Ribbon -->
    <path d="M-150 -70 L150 -70 L140 -35 L-140 -35 Z" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    
    <!-- Waistband Brand Text & Golden Arches -->
    <text x="-120" y="-48" fill="#e11d48" font-family="'Inter', sans-serif" font-size="11" font-weight="800">Undies</text>
    <!-- Golden arch mini -->
    <path d="M-82 -46 Q -78 -58 -74 -46 Q -70 -58 -66 -46" stroke="#fbbf24" stroke-width="3" fill="none" stroke-linecap="round"/>
    <text x="-52" y="-48" fill="#e11d48" font-family="'Inter', sans-serif" font-size="11" font-weight="800">McUndies</text>
    <path d="M12 -46 Q 16 -58 20 -46 Q 24 -58 28 -46" stroke="#fbbf24" stroke-width="3" fill="none" stroke-linecap="round"/>
    <text x="42" y="-48" fill="#e11d48" font-family="'Inter', sans-serif" font-size="11" font-weight="800">McUndies</text>

    <!-- Green Lettuce leaf sticking out on left -->
    <path d="M-140 -20 C -180 -10, -175 40, -150 65 C -135 78, -125 45, -120 20 Z" fill="#65a30d"/>
    <path d="M-150 15 C -170 30, -160 55, -145 60" stroke="#84cc16" stroke-width="2" fill="none"/>

    <!-- Left Bun Cheek -->
    <ellipse cx="-65" cy="45" rx="72" ry="78" fill="#d97706" transform="rotate(12 -65 45)"/>
    <ellipse cx="-65" cy="45" rx="68" ry="74" fill="#b45309" fill-opacity="0.4" transform="rotate(12 -65 45)"/>
    <!-- Bun gradient depth -->
    <radialGradient id="bunGradL" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="60%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </radialGradient>
    <ellipse cx="-65" cy="45" rx="68" ry="74" fill="url(#bunGradL)" transform="rotate(12 -65 45)"/>

    <!-- Right Bun Cheek -->
    <radialGradient id="bunGradR" cx="70%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="60%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </radialGradient>
    <ellipse cx="65" cy="45" rx="72" ry="78" fill="#d97706" transform="rotate(-12 65 45)"/>
    <ellipse cx="65" cy="45" rx="68" ry="74" fill="url(#bunGradR)" transform="rotate(-12 65 45)"/>

    <!-- Golden French Fries in center -->
    <!-- Middle fry -->
    <rect x="-10" y="-10" width="20" height="120" rx="4" fill="#fbbf24" stroke="#d97706" stroke-width="1.5"/>
    <rect x="-8" y="-8" width="16" height="116" rx="2" fill="#fde047"/>
    <!-- Left fry -->
    <rect x="-26" y="8" width="18" height="96" rx="3" fill="#f59e0b" transform="rotate(-8 -26 8)"/>
    <!-- Right fry -->
    <rect x="12" y="8" width="18" height="100" rx="3" fill="#f59e0b" transform="rotate(8 12 8)"/>

  </g>
</svg>
