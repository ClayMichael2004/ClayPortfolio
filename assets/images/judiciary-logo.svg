<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 120" width="420" height="120">
  <!-- Scales of Justice Emblem -->
  <g transform="translate(15, 10)">
    <circle cx="50" cy="50" r="46" fill="#f8fafc" stroke="#b45309" stroke-width="3"/>
    <!-- Scales beam -->
    <line x1="24" y1="36" x2="76" y2="36" stroke="#b45309" stroke-width="3" stroke-linecap="round"/>
    <line x1="50" y1="20" x2="50" y2="82" stroke="#b45309" stroke-width="3"/>
    <circle cx="50" cy="20" r="4" fill="#b45309"/>
    <!-- Left pan -->
    <path d="M 24 36 L 16 58 L 32 58 Z" fill="none" stroke="#b45309" stroke-width="2"/>
    <path d="M 14 58 Q 24 68 34 58 Z" fill="#b45309"/>
    <!-- Right pan -->
    <path d="M 76 36 L 68 58 L 84 58 Z" fill="none" stroke="#b45309" stroke-width="2"/>
    <path d="M 66 58 Q 76 68 86 58 Z" fill="#b45309"/>
    <!-- Base -->
    <path d="M 38 82 L 62 82" stroke="#b45309" stroke-width="4" stroke-linecap="round"/>
  </g>
  <!-- Text -->
  <text x="125" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#1e293b" letter-spacing="0.5">THE JUDICIARY</text>
  <text x="125" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#047857" letter-spacing="1.5">REPUBLIC OF KENYA</text>
  <text x="125" y="86" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#64748b" letter-spacing="0.5">Judicial Service Commission</text>
</svg>