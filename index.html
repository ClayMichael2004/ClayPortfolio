<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Michael Clay — Software Developer Portfolio</title>
  <meta name="description" content="Portfolio of Michael Clay, Software Developer at Zone01 Kisumu, experienced with the Judicial Service Commission Kenya.">
  <link rel="icon" type="image/png" href="assets/images/logo.png">

  <!-- Google Fonts: Inter & Plus Jakarta Sans for exact clean typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Top Sticky Navigation Bar -->
  <header class="top-nav" id="top-nav">
    <div class="nav-container">
      <a href="#hero" class="nav-logo" aria-label="Home">
        <img src="assets/images/logo.png" alt="Asterisk Logo" class="asterisk-logo">
      </a>
      <button class="hamburger-btn" id="hamburger-btn" aria-label="Open Navigation Menu" aria-expanded="false">
        <span class="hamburger-line"></span>
        <span class="hamburger-line"></span>
        <span class="hamburger-line"></span>
      </button>
    </div>
  </header>

  <!-- Slideout Drawer Overlay & Panel (Hamburger Menu) -->
  <div class="nav-drawer-overlay" id="drawer-overlay" aria-hidden="true"></div>
  <aside class="nav-drawer" id="nav-drawer" aria-label="Main Navigation" aria-hidden="true">
    <div class="drawer-header">
      <button class="drawer-close-btn" id="drawer-close-btn" aria-label="Close Navigation Menu">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>
    <nav class="drawer-nav">
      <ul class="drawer-menu-list">
        <li><a href="#hero" class="drawer-link">Home</a></li>
        <li><a href="#projects" class="drawer-link">Projects</a></li>
        <li><a href="#about" class="drawer-link">About</a></li>
        <li><a href="#about" class="drawer-link" id="drawer-30under30">30 Under 30</a></li>
        <li><a href="#footer" class="drawer-link">Contact</a></li>
      </ul>
    </nav>
  </aside>

  <main>
    <!-- HERO / INTRODUCTION SECTION (Header-introduction.png) -->
    <section class="hero-section" id="hero">
      <div class="hero-container">
        
        <!-- Figma-style Selection Box for "clay" -->
        <div class="hero-name-wrapper">
          <div class="figma-selection-box">
            <!-- 4 corner handles -->
            <span class="handle handle-tl"></span>
            <span class="handle handle-tr"></span>
            <span class="handle handle-bl"></span>
            <span class="handle handle-br"></span>

            <h1 class="hero-name" aria-label="clay">
              <span class="letter-c">c</span>
              <span class="letter-l">l</span>
              <span class="letter-a" aria-hidden="true">
                <svg viewBox="0 0 100 100" width="100%" height="100%">
                  <!-- Exact purple geometric circle with straight right & flat base -->
                  <path d="M 50 2 C 76.5 2 98 23.5 98 50 L 98 98 L 50 98 C 23.5 98 2 76.5 2 50 C 2 23.5 23.5 2 50 2 Z" fill="#8400F0"/>
                </svg>
              </span>
              <span class="letter-y">y</span>
            </h1>
          </div>
        </div>

        <!-- Hero Subtitle -->
        <p class="hero-subtitle">
          Software Developer at <strong>Zone01 Kisumu</strong>, designing and building modern web applications.
        </p>

        <!-- Hero Action Buttons -->
        <div class="hero-cta-group">
          <a href="#about" class="btn btn-outline">About Me</a>
          <a href="#projects" class="btn btn-purple">Projects</a>
        </div>

      </div>
    </section>
  </main>
</body>
</html>
